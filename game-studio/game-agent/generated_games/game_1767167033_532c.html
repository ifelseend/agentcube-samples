<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026新年庆祝游戏 - 关卡挑战版</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(to bottom, #0a0e27 0%, #1a237e 50%, #283593 100%);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            cursor: crosshair;
        }
        
        canvas {
            display: block;
            position: relative;
        }
        
        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        
        .game-header {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        
        .score-panel {
            color: white;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        
        .level-info {
            color: #FFD700;
            font-size: 22px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            text-align: center;
        }
        
        .timer-panel {
            color: #FF69B4;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            text-align: right;
        }
        
        .timer-panel.warning {
            color: #FF6B6B;
            animation: pulse 1s infinite;
        }
        
        .combo {
            position: absolute;
            top: 80px;
            left: 20px;
            color: #FFD700;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .combo.active {
            opacity: 1;
            animation: comboGlow 0.5s ease-in-out;
        }
        
        @keyframes comboGlow {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }
        
        .powerup-indicator {
            position: absolute;
            top: 120px;
            left: 20px;
            color: #00FA9A;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .powerup-indicator.active {
            opacity: 1;
        }
        
        .message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 48px;
            font-weight: bold;
            text-align: center;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.7);
            animation: pulse 2s infinite;
            pointer-events: none;
        }
        
        .year-display {
            font-size: 72px;
            color: #FFD700;
            margin-bottom: 20px;
            animation: glow 2s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.05); }
        }
        
        @keyframes glow {
            0%, 100% { text-shadow: 0 0 20px #FFD700, 0 0 40px #FFD700; }
            50% { text-shadow: 0 0 30px #FFD700, 0 0 60px #FFD700; }
        }
        
        .instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 16px;
            text-align: center;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }
        
        .particle-text {
            position: absolute;
            color: #FFD700;
            font-size: 24px;
            font-weight: bold;
            pointer-events: none;
            animation: floatUp 1s ease-out forwards;
        }
        
        @keyframes floatUp {
            0% { 
                opacity: 1; 
                transform: translateY(0);
            }
            100% { 
                opacity: 0; 
                transform: translateY(-50px);
            }
        }
        
        .level-complete {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 30px 50px;
            border-radius: 20px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            z-index: 100;
            display: none;
            border: 3px solid #FFD700;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
        }
        
        .level-complete.show {
            display: block;
            animation: slideIn 0.5s ease-out;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.5);
            }
            to {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
        }
        
        .celebration-text {
            font-size: 32px;
            color: #FFD700;
            margin: 20px 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        
        .next-level-btn {
            background: linear-gradient(45deg, #FFD700, #FFA500);
            color: #333;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 20px;
            transition: transform 0.3s;
        }
        
        .next-level-btn:hover {
            transform: scale(1.1);
        }
        
        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(139, 0, 0, 0.9);
            color: white;
            padding: 30px 50px;
            border-radius: 20px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            z-index: 100;
            display: none;
            border: 3px solid #FF6B6B;
        }
        
        .game-over.show {
            display: block;
            animation: slideIn 0.5s ease-out;
        }
        
        .restart-btn {
            background: linear-gradient(45deg, #FF6B6B, #FF1493);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 20px;
            transition: transform 0.3s;
        }
        
        .restart-btn:hover {
            transform: scale(1.1);
        }
        
        .progress-bar {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            height: 20px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #FFD700, #FFA500);
            border-radius: 10px;
            transition: width 0.3s ease;
            width: 0%;
        }
        
        .target-score {
            position: absolute;
            bottom: 85px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 14px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }
    </style>
</head>

        // 开始关卡
        function startLevel(levelIndex) {
            if (levelIndex >= gameData.levels.length) {
                // 游戏通关
                showGameComplete();
                return;
            }
            
            currentLevel = levelIndex;
            const level = gameData.levels[levelIndex];
            
            // 重置游戏状态
            score = 0;
            combo = 0;
            timeRemaining = level.timeLimit;
            gameActive = true;
            
            // 生成关卡元素
            balloons = generateBalloonsForLevel(level);
            powerups = generatePowerupsForLevel(level);
            
            // 更新UI
            document.getElementById('levelName').textContent = level.name;
            document.getElementById('targetScore').textContent = level.targetScore;
            document.getElementById('targetProgress').textContent = level.targetScore;
            document.getElementById('score').textContent = score;
            document.getElementById('timer').textContent = timeRemaining;
            document.getElementById('currentProgress').textContent = score;
            updateProgress();
            updateCombo();
            
            // 隐藏消息
            document.getElementById('gameMessage').style.display = 'none';
            
            // 开始计时
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(updateTimer, 1000);
        }
        
        // 生成气球
        function generateBalloonsForLevel(level) {
            const balloons = [];
            const colors = ['#FF6B6B', '#4ECDC4', '#45B7D1', '#FFA07A', '#98D8C8', '#FFD700', '#FF69B4', '#FF1493'];
            
            for (let i = 0; i < level.balloonCount; i++) {
                const speedMultiplier = 1 + (i * 0.15);
                balloons.push({
                    x: Math.random() * 700 + 50,
                    y: 500 + Math.random() * 100,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    speed: (Math.random() * 0.8 + 1.2) * speedMultiplier * level.balloonSpeed,
                    wobble: Math.random() * Math.PI * 2,
                    wobbleSpeed: Math.random() * 0.05 + 0.03,
                    popped: false,
                    points: 10 + (i * 3),
                    size: Math.max(12, 25 - (i * 0.8))
                });
            }
            
            return balloons;
        }
        
        // 生成道具
        function generatePowerupsForLevel(level) {
            const powerups = [];
            const types = ['multishot', 'bonus', 'slowmo', 'timewarp', 'megapoints'];
            
            for (let i = 0; i < level.powerupCount; i++) {
                powerups.push({
                    x: Math.random() * 600 + 100,
                    y: Math.random() * 200 + 200,
                    type: types[Math.floor(Math.random() * types.length)],
                    collected: false,
                    rotation: 0
                });
            }
            
            return powerups;
        }
        
        // 更新计时器
        function updateTimer() {
            if (!gameActive) return;
            
            timeRemaining--;
            document.getElementById('timer').textContent = timeRemaining;
            
            // 时间警告
            const timerPanel = document.getElementById('timerPanel');
            if (timeRemaining <= 10) {
                timerPanel.classList.add('warning');
            } else {
                timerPanel.classList.remove('warning');
            }
            
            // 检查游戏结束
            if (timeRemaining <= 0) {
                endLevel(false);
            }
        }
        
        // 更新进度条
        function updateProgress() {
            const level = gameData.levels[currentLevel];
            const progress = Math.min((score / level.targetScore) * 100, 100);
            document.getElementById('progressFill').style.width = progress + '%';
            document.getElementById('currentProgress').textContent = score;
            
            // 检查是否达到目标
            if (score >= level.targetScore && gameActive) {
                endLevel(true);
            }
        }
        
        // 结束关卡
        function endLevel(success) {
            gameActive = false;
            clearInterval(timerInterval);
            
            const level = gameData.levels[currentLevel];
            
            if (success) {
                // 显示关卡完成界面
                const celebrationText = gameData.celebrations[Math.floor(Math.random() * gameData.celebrations.length)];
                document.getElementById('celebrationText').textContent = celebrationText;
                document.getElementById('timeUsed').textContent = level.timeLimit - timeRemaining;
                document.getElementById('finalScore').textContent = score;
                document.getElementById('levelComplete').classList.add('show');
                
                // 庆祝烟花
                for (let i = 0; i < 10; i++) {
                    setTimeout(() => {
                        createFirework(
                            Math.random() * canvas.width,
                            Math.random() * canvas.height * 0.6
                        );
                    }, i * 200);
                }
            } else {
                // 显示游戏结束界面
                document.getElementById('finalScoreOver').textContent = score;
                document.getElementById('targetScoreOver').textContent = level.targetScore;
                document.getElementById('gameOver').classList.add('show');
            }
        }
        
        // 下一关
        function nextLevel() {
            document.getElementById('levelComplete').classList.remove('show');
            startLevel(currentLevel + 1);
        }
        
        // 重新开始游戏
        function restartGame() {
            document.getElementById('gameOver').classList.remove('show');
            startLevel(0);
        }
        
        // 游戏通关
        function showGameComplete() {
            gameActive = false;
            clearInterval(timerInterval);
            
            const completeDiv = document.getElementById('levelComplete');
            completeDiv.innerHTML = `
                <div>🏆 恭喜通关！🏆</div>
                <div class="celebration-text">你是真正的游戏大师！</div>
                <div>总得分: ${score}</div>
                <div>最高连击: ${maxCombo}</div>
                <button class="next-level-btn" onclick="restartGame()">重新挑战</button>
            `;
            completeDiv.classList.add('show');
            
            // 终极庆祝烟花
            for (let i = 0; i < 20; i++) {
                setTimeout(() => {
                    createFirework(
                        Math.random() * canvas.width,
                        Math.random() * canvas.height * 0.6
                    );
                }, i * 100);
            }
        }
        
        // 创建分数粒子效果
        function createScoreParticle(x, y, points) {
            const particle = document.createElement('div');
            particle.className = 'particle-text';
            particle.textContent = `+${points}`;
            particle.style.left = x + 'px';
            particle.style.top = y + 'px';
            document.body.appendChild(particle);
            
            setTimeout(() => particle.remove(), 1000);
        }
        
        // 绘制星星
        function drawStars() {
            stars.forEach(star => {
                ctx.save();
                ctx.fillStyle = `rgba(255, 255, 255, ${star.twinkle})`;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
                
                // 星星光晕
                if (star.size > 1.5) {
                    ctx.globalAlpha = star.twinkle * 0.3;
                    ctx.beginPath();
                    ctx.arc(star.x, star.y, star.size * 2, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
                
                // 闪烁效果
                star.twinkle += (Math.random() - 0.5) * star.twinkleSpeed;
                star.twinkle = Math.max(0.3, Math.min(1, star.twinkle));
            });
        }
        
        // 绘制气球
        function drawBalloons() {
            balloons.forEach(balloon => {
                if (!balloon.popped) {
                    ctx.save();
                    
                    // 气球阴影
                    ctx.shadowColor = 'rgba(0, 0, 0, 0.3)';
                    ctx.shadowBlur = 10;
                    ctx.shadowOffsetY = 5;
                    
                    // 气球主体
                    ctx.fillStyle = balloon.color;
                    ctx.beginPath();
                    ctx.ellipse(balloon.x, balloon.y, balloon.size, balloon.size * 1.2, 0, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // 高光
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
                    ctx.beginPath();
                    ctx.ellipse(balloon.x - balloon.size * 0.3, balloon.y - balloon.size * 0.4, 
                               balloon.size * 0.3, balloon.size * 0.4, -Math.PI/4, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // 分数标签
                    ctx.fillStyle = 'white';
                    ctx.font = 'bold 12px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText(balloon.points, balloon.x, balloon.y + 3);
                    
                    // 绳子
                    ctx.strokeStyle = '#666';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(balloon.x, balloon.y + balloon.size * 1.2);
                    ctx.lineTo(balloon.x, balloon.y + balloon.size * 1.2 + 30);
                    ctx.stroke();
                    
                    ctx.restore();
                    
                    // 更新气球位置
                    const speedMultiplier = slowmoActive ? 0.3 : (timewarpActive ? 0.1 : 1);
                    balloon.y -= balloon.speed * speedMultiplier;
                    balloon.wobble += balloon.wobbleSpeed * speedMultiplier;
                    balloon.x += Math.sin(balloon.wobble) * 0.8;
                    
                    // 重置位置
                    if (balloon.y < -50) {
                        balloon.y = 500 + Math.random() * 100;
                        balloon.x = Math.random() * 750 + 25;
                        combo = 0;
                        updateCombo();
                    }
                }
            });
        }
        
        // 绘制道具
        function drawPowerups() {
            powerups.forEach(powerup => {
                if (!powerup.collected) {
                    ctx.save();
                    ctx.translate(powerup.x, powerup.y);
                    ctx.rotate(powerup.rotation);
                    
                    // 道具光晕
                    const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, 20);
                    gradient.addColorStop(0, 'rgba(255, 255, 255, 0.8)');
                    gradient.addColorStop(0.5, 'rgba(255, 215, 0, 0.5)');
                    gradient.addColorStop(1, 'rgba(255, 215, 0, 0)');
                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.arc(0, 0, 20, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // 道具图标
                    ctx.fillStyle = '#FFD700';
                    ctx.font = 'bold 16px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    
                    if (powerup.type === 'multishot') {
                        ctx.fillText('⚡', 0, 0);
                    } else if (powerup.type === 'bonus') {
                        ctx.fillText('💎', 0, 0);
                    } else if (powerup.type === 'slowmo') {
                        ctx.fillText('❄️', 0, 0);
                    } else if (powerup.type === 'timewarp') {
                        ctx.fillText('⏰', 0, 0);
                    } else if (powerup.type === 'megapoints') {
                        ctx.fillText('💰', 0, 0);
                    }
                    
                    ctx.restore();
                    
                    // 旋转动画
                    powerup.rotation += 0.05;
                }
            });
        }
        
        // 绘制烟花
        function drawFireworks() {
            activeFireworks = activeFireworks.filter(firework => {
                let alive = false;
                
                firework.particles.forEach(particle => {
                    if (particle.life > 0) {
                        alive = true;
                        ctx.save();
                        ctx.globalAlpha = particle.life;
                        
                        // 粒子拖尾
                        const gradient = ctx.createRadialGradient(
                            particle.x, particle.y, 0,
                            particle.x, particle.y, 6
                        );
                        gradient.addColorStop(0, firework.color);
                        gradient.addColorStop(0.5, firework.color);
                        gradient.addColorStop(1, 'transparent');
                        
                        ctx.fillStyle = gradient;
                        ctx.beginPath();
                        ctx.arc(particle.x, particle.y, 4, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.restore();
                        
                        // 更新粒子
                        particle.x += particle.vx;
                        particle.y += particle.vy;
                        particle.vy += 0.15;
                        particle.life -= 0.015;
                        
                        // 添加轨迹
                        if (Math.random() < 0.3) {
                            trails.push({
                                x: particle.x,
                                y: particle.y,
                                life: 0.5,
                                color: firework.color
                            });
                        }
                    }
                });
                
                return alive;
            });
        }
        
        // 绘制轨迹
        function drawTrails() {
            trails = trails.filter(trail => {
                if (trail.life > 0) {
                    ctx.save();
                    ctx.globalAlpha = trail.life;
                    ctx.fillStyle = trail.color;
                    ctx.beginPath();
                    ctx.arc(trail.x, trail.y, 2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                    
                    trail.life -= 0.02;
                    return true;
                }
                return false;
            });
        }
        
        // 创建烟花
        function createFirework(x, y, color = null) {
            const colors = color ? [color] : ['#FF6B6B', '#4ECDC4', '#45B7D1', '#FFA07A', '#98D8C8', '#FFD700', '#FF69B4', '#00CED1', '#FF1493', '#00FA9A'];
            const firework = {
                x: x,
                y: y,
                color: colors[Math.floor(Math.random() * colors.length)],
                particles: []
            };
            
            const particleCount = multishotActive ? 60 : 50;
            for (let i = 0; i < particleCount; i++) {
                const angle = (Math.PI * 2 * i) / particleCount;
                const speed = Math.random() * 4 + 2;
                firework.particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 1.0
                });
            }
            
            activeFireworks.push(firework);
        }
        
        // 激活道具
        function activatePowerup(type) {
            const indicator = document.getElementById('powerupIndicator');
            
            if (type === 'multishot') {
                multishotActive = true;
                indicator.textContent = '⚡ 多重射击激活！';
                score += 50;
            } else if (type === 'bonus') {
                indicator.textContent = '💎 奖励分数 +100！';
                score += 100;
            } else if (type === 'slowmo') {
                slowmoActive = true;
                indicator.textContent = '❄️ 时间减缓激活！';
            } else if (type === 'timewarp') {
                timewarpActive = true;
                indicator.textContent = '⏰ 时间扭曲激活！';
                timeRemaining += 10; // 增加10秒时间
                document.getElementById('timer').textContent = timeRemaining;
            } else if (type === 'megapoints') {
                indicator.textContent = '💰 超级分数 x3！';
                // 下一个气球3倍分数
            }
            
            indicator.classList.add('active');
            powerupTimer = 300;
            
            setTimeout(() => {
                indicator.classList.remove('active');
            }, 2000);
        }
        
        // 更新连击显示
        function updateCombo() {
            const comboElement = document.getElementById('combo');
            const comboCount = document.getElementById('comboCount');
            
            if (combo > 1) {
                comboElement.classList.add('active');
                comboCount.textContent = combo;
                
                if (combo > maxCombo) {
                    maxCombo = combo;
                    document.getElementById('maxCombo').textContent = maxCombo;
                }
            } else {
                comboElement.classList.remove('active');
            }
        }
        
        // 处理点击
        canvas.addEventListener('click', (e) => {
            if (!gameActive) return;
            
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            let hitBalloon = false;
            
            // 检查道具
            powerups.forEach(powerup => {
                if (!powerup.collected) {
                    const dist = Math.sqrt((x - powerup.x) ** 2 + (y - powerup.y) ** 2);
                    if (dist < 20) {
                        powerup.collected = true;
                        activatePowerup(powerup.type);
                        
                        // 重新生成道具
                        setTimeout(() => {
                            if (gameActive) {
                                powerup.collected = false;
                                powerup.x = Math.random() * 600 + 100;
                                powerup.y = Math.random() * 200 + 200;
                            }
                        }, 8000);
                    }
                }
            });
            
            // 检查气球
            balloons.forEach(balloon => {
                if (!balloon.popped) {
                    const dist = Math.sqrt((x - balloon.x) ** 2 + (y - balloon.y) ** 2);
                    if (dist < balloon.size) {
                        balloon.popped = true;
                        combo++;
                        
                        // 计算分数
                        let points = balloon.points * (1 + Math.floor(combo / 5) * 0.5);
                        score += Math.floor(points);
                        
                        // 创建分数粒子
                        createScoreParticle(e.clientX, e.clientY, Math.floor(points));
                        
                        document.getElementById('score').textContent = score;
                        hitBalloon = true;
                        
                        // 在气球位置创建烟花
                        createFirework(balloon.x, balloon.y, balloon.color);
                        
                        // 多重射击效果
                        if (multishotActive) {
                            for (let i = 0; i < 3; i++) {
                                setTimeout(() => {
                                    createFirework(
                                        balloon.x + (Math.random() - 0.5) * 100,
                                        balloon.y + (Math.random() - 0.5) * 100,
                                        balloon.color
                                    );
                                }, i * 100);
                            }
                        }
                        
                        // 重新生成气球
                        setTimeout(() => {
                            if (gameActive) {
                                balloon.popped = false;
                                balloon.y = 500 + Math.random() * 100;
                                balloon.x = Math.random() * 750 + 25;
                            }
                        }, 1000);
                        
                        updateCombo();
                        updateProgress();
                    }
                }
            });
            
            // 如果没有点击气球，创建烟花
            if (!hitBalloon) {
                createFirework(x, y);
                combo = 0;
                updateCombo();
            }
        });
        
        // 游戏循环
        function gameLoop() {
            // 清空画布
            ctx.fillStyle = 'rgba(10, 14, 39, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 更新道具效果
            if (powerupTimer > 0) {
                powerupTimer--;
                if (powerupTimer === 0) {
                    multishotActive = false;
                    slowmoActive = false;
                    timewarpActive = false;
                }
            }
            
            // 绘制元素
            drawStars();
            drawTrails();
            drawPowerups();
            drawBalloons();
            drawFireworks();
            
            requestAnimationFrame(gameLoop);
        }
        
        // 自动烟花
        setInterval(() => {
            if (Math.random() < 0.4) {
                createFirework(
                    Math.random() * canvas.width,
                    Math.random() * canvas.height * 0.5
                );
            }
        }, 1500);
        
        // 启动游戏
        startLevel(0);
        gameLoop();
    </script>
</body>
</html>
