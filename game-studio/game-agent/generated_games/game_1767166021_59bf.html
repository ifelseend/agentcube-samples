    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(to bottom, #0a0e27 0%, #1a237e 50%, #283593 100%);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            cursor: crosshair;
        }
        
        canvas {
            display: block;
            position: relative;
        }
        
        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        
        .score {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        
        .message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 48px;
            font-weight: bold;
            text-align: center;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.7);
            animation: pulse 2s infinite;
            pointer-events: none;
        }
        
        .year-display {
            font-size: 72px;
            color: #FFD700;
            margin-bottom: 20px;
            animation: glow 2s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.05); }
        }
        
        @keyframes glow {
            0%, 100% { text-shadow: 0 0 20px #FFD700, 0 0 40px #FFD700; }
            50% { text-shadow: 0 0 30px #FFD700, 0 0 60px #FFD700; }
        }
        
        .instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 16px;
            text-align: center;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }
    </style>

        // Canvas设置
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 800;
        canvas.height = 600;
        
        // 游戏状态
        let score = 0;
        let fireworks = JSON.parse(JSON.stringify(gameData.fireworks));
        let stars = JSON.parse(JSON.stringify(gameData.stars));
        let balloons = JSON.parse(JSON.stringify(gameData.balloons));
        let activeFireworks = [];
        
        // 更新UI中的年份和消息
        document.querySelector('.year-display').textContent = gameData.year;
        document.querySelector('.message > div:last-child').textContent = gameData.message;
        
        // 绘制星星
        function drawStars() {
            stars.forEach(star => {
                ctx.save();
                ctx.fillStyle = `rgba(255, 255, 255, ${star.twinkle})`;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
                
                // 闪烁效果
                star.twinkle += (Math.random() - 0.5) * 0.05;
                star.twinkle = Math.max(0.3, Math.min(1, star.twinkle));
            });
        }
        
        // 绘制气球
        function drawBalloons() {
            balloons.forEach(balloon => {
                if (!balloon.popped) {
                    ctx.save();
                    
                    // 气球主体
                    ctx.fillStyle = balloon.color;
                    ctx.beginPath();
                    ctx.ellipse(balloon.x, balloon.y, 25, 30, 0, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // 高光
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                    ctx.beginPath();
                    ctx.ellipse(balloon.x - 8, balloon.y - 10, 8, 10, -Math.PI/4, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // 绳子
                    ctx.strokeStyle = '#666';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(balloon.x, balloon.y + 30);
                    ctx.lineTo(balloon.x, balloon.y + 60);
                    ctx.stroke();
                    
                    ctx.restore();
                    
                    // 更新气球位置
                    balloon.y -= balloon.speed;
                    balloon.wobble += 0.05;
                    balloon.x += Math.sin(balloon.wobble) * 0.5;
                    
                    // 重置位置
                    if (balloon.y < -50) {
                        balloon.y = 500 + Math.random() * 100;
                        balloon.x = Math.random() * 750 + 25;
                    }
                }
            });
        }
        
        // 绘制烟花
        function drawFireworks() {
            activeFireworks = activeFireworks.filter(firework => {
                let alive = false;
                
                firework.particles.forEach(particle => {
                    if (particle.life > 0) {
                        alive = true;
                        ctx.save();
                        ctx.globalAlpha = particle.life;
                        ctx.fillStyle = firework.color;
                        ctx.beginPath();
                        ctx.arc(particle.x, particle.y, 3, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.restore();
                        
                        // 更新粒子
                        particle.x += particle.vx;
                        particle.y += particle.vy;
                        particle.vy += 0.1; // 重力
                        particle.life -= 0.02;
                    }
                });
                
                return alive;
            });
        }
        
        // 创建烟花
        function createFirework(x, y) {
            const colors = ['#FF6B6B', '#4ECDC4', '#45B7D1', '#FFA07A', '#98D8C8', '#FFD700', '#FF69B4', '#00CED1'];
            const firework = {
                x: x,
                y: y,
                color: colors[Math.floor(Math.random() * colors.length)],
                particles: []
            };
            
            for (let i = 0; i < 30; i++) {
                const angle = (Math.PI * 2 * i) / 30;
                const speed = Math.random() * 3 + 2;
                firework.particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 1.0
                });
            }
            
            activeFireworks.push(firework);
        }
        
        // 处理点击
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            let hitBalloon = false;
            
            // 检查是否点击到气球
            balloons.forEach(balloon => {
                if (!balloon.popped) {
                    const dist = Math.sqrt((x - balloon.x) ** 2 + (y - balloon.y) ** 2);
                    if (dist < 30) {
                        balloon.popped = true;
                        score += 10;
                        document.getElementById('score').textContent = score;
                        hitBalloon = true;
                        
                        // 在气球位置创建烟花
                        createFirework(balloon.x, balloon.y);
                        
                        // 重新生成气球
                        setTimeout(() => {
                            balloon.popped = false;
                            balloon.y = 500 + Math.random() * 100;
                            balloon.x = Math.random() * 750 + 25;
                        }, 1000);
                    }
                }
            });
            
            // 如果没有点击气球，创建烟花
            if (!hitBalloon) {
                createFirework(x, y);
            }
        });
        
        // 游戏循环
        function gameLoop() {
            // 清空画布
            ctx.fillStyle = 'rgba(10, 14, 39, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 绘制元素
            drawStars();
            drawBalloons();
            drawFireworks();
            
            requestAnimationFrame(gameLoop);
        }
        
        // 自动烟花
        setInterval(() => {
            if (Math.random() < 0.3) {
                createFirework(
                    Math.random() * canvas.width,
                    Math.random() * canvas.height * 0.5
                );
            }
        }, 2000);
        
        // 启动游戏
        gameLoop();
    </script>
