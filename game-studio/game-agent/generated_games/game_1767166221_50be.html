<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026新年庆祝游戏 - 增强版</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(to bottom, #0a0e27 0%, #1a237e 50%, #283593 100%);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            cursor: crosshair;
        }
        
        canvas {
            display: block;
            position: relative;
        }
        
        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        
        .score-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        
        .combo {
            position: absolute;
            top: 60px;
            left: 20px;
            color: #FFD700;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .combo.active {
            opacity: 1;
            animation: comboGlow 0.5s ease-in-out;
        }
        
        @keyframes comboGlow {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }
        
        .powerup-indicator {
            position: absolute;
            top: 100px;
            left: 20px;
            color: #00FA9A;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .powerup-indicator.active {
            opacity: 1;
        }
        
        .message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 48px;
            font-weight: bold;
            text-align: center;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.7);
            animation: pulse 2s infinite;
            pointer-events: none;
        }
        
        .year-display {
            font-size: 72px;
            color: #FFD700;
            margin-bottom: 20px;
            animation: glow 2s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.05); }
        }
        
        @keyframes glow {
            0%, 100% { text-shadow: 0 0 20px #FFD700, 0 0 40px #FFD700; }
            50% { text-shadow: 0 0 30px #FFD700, 0 0 60px #FFD700; }
        }
        
        .instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 16px;
            text-align: center;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }
        
        .level-indicator {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #FF69B4;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        
        .particle-text {
            position: absolute;
            color: #FFD700;
            font-size: 24px;
            font-weight: bold;
            pointer-events: none;
            animation: floatUp 1s ease-out forwards;
        }
        
        @keyframes floatUp {
            0% { 
                opacity: 1; 
                transform: translateY(0);
            }
            100% { 
                opacity: 0; 
                transform: translateY(-50px);
            }
        }
    </style>
</head>

        // 绘制星星
        function drawStars() {
            stars.forEach(star => {
                ctx.save();
                ctx.fillStyle = `rgba(255, 255, 255, ${star.twinkle})`;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
                
                // 星星光晕
                if (star.size > 1.5) {
                    ctx.globalAlpha = star.twinkle * 0.3;
                    ctx.beginPath();
                    ctx.arc(star.x, star.y, star.size * 2, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
                
                // 闪烁效果
                star.twinkle += (Math.random() - 0.5) * star.twinkleSpeed;
                star.twinkle = Math.max(0.3, Math.min(1, star.twinkle));
            });
        }
        
        // 绘制气球
        function drawBalloons() {
            balloons.forEach(balloon => {
                if (!balloon.popped) {
                    ctx.save();
                    
                    // 气球阴影
                    ctx.shadowColor = 'rgba(0, 0, 0, 0.3)';
                    ctx.shadowBlur = 10;
                    ctx.shadowOffsetY = 5;
                    
                    // 气球主体
                    ctx.fillStyle = balloon.color;
                    ctx.beginPath();
                    ctx.ellipse(balloon.x, balloon.y, balloon.size, balloon.size * 1.2, 0, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // 高光
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
                    ctx.beginPath();
                    ctx.ellipse(balloon.x - balloon.size * 0.3, balloon.y - balloon.size * 0.4, 
                               balloon.size * 0.3, balloon.size * 0.4, -Math.PI/4, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // 分数标签
                    ctx.fillStyle = 'white';
                    ctx.font = 'bold 12px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText(balloon.points, balloon.x, balloon.y + 3);
                    
                    // 绳子
                    ctx.strokeStyle = '#666';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(balloon.x, balloon.y + balloon.size * 1.2);
                    ctx.lineTo(balloon.x, balloon.y + balloon.size * 1.2 + 30);
                    ctx.stroke();
                    
                    ctx.restore();
                    
                    // 更新气球位置
                    const speedMultiplier = slowmoActive ? 0.3 : 1;
                    balloon.y -= balloon.speed * speedMultiplier;
                    balloon.wobble += balloon.wobbleSpeed * speedMultiplier;
                    balloon.x += Math.sin(balloon.wobble) * 0.8;
                    
                    // 重置位置

                        updateCombo();
                    }
                }
            });

        // 绘制道具
        function drawPowerups() {
            powerups.forEach(powerup => {
                if (!powerup.collected) {
                    ctx.save();
                    ctx.translate(powerup.x, powerup.y);
                    ctx.rotate(powerup.rotation);
                    
                    // 道具光晕
                    const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, 20);
                    gradient.addColorStop(0, 'rgba(255, 255, 255, 0.8)');
                    gradient.addColorStop(0.5, 'rgba(255, 215, 0, 0.5)');
                    gradient.addColorStop(1, 'rgba(255, 215, 0, 0)');
                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.arc(0, 0, 20, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // 道具图标
                    ctx.fillStyle = '#FFD700';
                    ctx.font = 'bold 16px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    
                    if (powerup.type === 'multishot') {
                        ctx.fillText('⚡', 0, 0);
                    } else if (powerup.type === 'bonus') {
                        ctx.fillText('💎', 0, 0);
                    } else if (powerup.type === 'slowmo') {
                        ctx.fillText('❄️', 0, 0);
                    }
                    
                    ctx.restore();
                    
                    // 旋转动画
                    powerup.rotation += 0.05;
                }
            });
        }

            activeFireworks = activeFireworks.filter(firework => {

                        ctx.save();
                        ctx.globalAlpha = particle.life;
                        
                        // 粒子拖尾
                        const gradient = ctx.createRadialGradient(
                            particle.x, particle.y, 0,
                            particle.x, particle.y, 6
                        );
                        gradient.addColorStop(0, firework.color);
                        gradient.addColorStop(0.5, firework.color);
                        gradient.addColorStop(1, 'transparent');
                        
                        ctx.fillStyle = gradient;
                        ctx.beginPath();
                        ctx.arc(particle.x, particle.y, 4, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.restore();
                        
                        // 更新粒子
                        particle.x += particle.vx;
                        particle.y += particle.vy;
                        particle.vy += 0.15; // 重力

                            trails.push({
                                x: particle.x,
                                y: particle.y,
                                life: 0.5,
                                color: firework.color
                            });
                        }
                    }
                });
                
                return alive;
            });
        }

                    ctx.fillStyle = trail.color;
                    ctx.beginPath();
                    ctx.arc(trail.x, trail.y, 2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                    
                    trail.life -= 0.02;
                    return true;
                }
                return false;
            });
        }

                });
            }
            
            activeFireworks.push(firework);
        }
        
        // 激活道具
        function activatePowerup(type) {
            const indicator = document.getElementById('powerupIndicator');
            
            if (type === 'multishot') {
                multishotActive = true;
                indicator.textContent = '⚡ 多重射击激活！';
                score += 50;
            } else if (type === 'bonus') {
                indicator.textContent = '💎 奖励分数 +100！';
                score += 100;
            } else if (type === 'slowmo') {
                slowmoActive = true;
                indicator.textContent = '❄️ 时间减缓激活！';
            }
            
            indicator.classList.add('active');
            powerupTimer = 300; // 5秒效果
            
            setTimeout(() => {
                indicator.classList.remove('active');
            }, 2000);
        }
        
        // 更新连击显示
        function updateCombo() {
            const comboElement = document.getElementById('combo');
            const comboCount = document.getElementById('comboCount');
            
            if (combo > 1) {
                comboElement.classList.add('active');
                comboCount.textContent = combo;
                
                if (combo > maxCombo) {
                    maxCombo = combo;
                    document.getElementById('maxCombo').textContent = maxCombo;
                }
            } else {
                comboElement.classList.remove('active');
            }
        }
        
        // 更新难度
        function updateDifficulty() {
            const newDifficulty = Math.floor(score / 200) + 1;
            if (newDifficulty !== difficulty) {
                difficulty = newDifficulty;
                document.getElementById('difficulty').textContent = difficulty;
                
                // 增加气球速度
                balloons.forEach((balloon, index) => {
                    balloon.speed *= 1.1;
                });
            }
        }
        
        // 处理点击
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            let hitBalloon = false;
            
            // 检查道具
            powerups.forEach(powerup => {
                if (!powerup.collected) {
                    const dist = Math.sqrt((x - powerup.x) ** 2 + (y - powerup.y) ** 2);
                    if (dist < 20) {
                        powerup.collected = true;
                        activatePowerup(powerup.type);
                        
                        // 重新生成道具
                        setTimeout(() => {
                            powerup.collected = false;
                            powerup.x = Math.random() * 700 + 50;
                            powerup.y = Math.random() * 200 + 200;
                        }, 10000);
                    }
                }
            });
            
            // 检查气球
            balloons.forEach(balloon => {
                if (!balloon.popped) {
                    const dist = Math.sqrt((x - balloon.x) ** 2 + (y - balloon.y) ** 2);
                    if (dist < balloon.size) {
                        balloon.popped = true;
                        combo++;
                        
                        // 计算分数
                        const points = balloon.points * (1 + Math.floor(combo / 5) * 0.5);
                        score += Math.floor(points);
                        
                        // 创建分数粒子
                        createScoreParticle(e.clientX, e.clientY, Math.floor(points));
                        
                        document.getElementById('score').textContent = score;
                        hitBalloon = true;
                        
                        // 在气球位置创建烟花
                        createFirework(balloon.x, balloon.y, balloon.color);
                        
                        // 多重射击效果
                        if (multishotActive) {
                            for (let i = 0; i < 3; i++) {
                                setTimeout(() => {
                                    createFirework(
                                        balloon.x + (Math.random() - 0.5) * 100,
                                        balloon.y + (Math.random() - 0.5) * 100,
                                        balloon.color
                                    );
                                }, i * 100);
                            }
                        }
                        
                        // 重新生成气球
                        setTimeout(() => {
                            balloon.popped = false;
                            balloon.y = 500 + Math.random() * 100;
                            balloon.x = Math.random() * 750 + 25;
                        }, 1000);
                        
                        updateCombo();
                        updateDifficulty();
                    }
                }
            });
            
            // 如果没有点击气球，创建烟花
            if (!hitBalloon) {
                createFirework(x, y);
                combo = 0;
                updateCombo();
            }
        });
        
        // 游戏循环
        function gameLoop() {
            // 清空画布
            ctx.fillStyle = 'rgba(10, 14, 39, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 更新道具效果
            if (powerupTimer > 0) {
                powerupTimer--;
                if (powerupTimer === 0) {
                    multishotActive = false;
                    slowmoActive = false;
                }
            }
            
            // 绘制元素
            drawStars();
            drawTrails();
            drawPowerups();
            drawBalloons();
            drawFireworks();
            
            requestAnimationFrame(gameLoop);
        }
        
        // 自动烟花
        setInterval(() => {
            if (Math.random() < 0.4) {
                createFirework(
                    Math.random() * canvas.width,
                    Math.random() * canvas.height * 0.5
                );
            }
        }, 1500);
        
        // 启动游戏
        gameLoop();
    </script>
</body>
</html>
