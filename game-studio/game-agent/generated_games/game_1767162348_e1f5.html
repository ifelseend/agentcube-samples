<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多食物贪吃蛇游戏</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .game-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }
        
        h1 {
            color: white;
            margin-bottom: 20px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
        
        .game-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            color: white;
            font-size: 1.2em;
        }
        
        .score, .high-score, .food-count {
            background: rgba(255, 255, 255, 0.2);
            padding: 10px 20px;
            border-radius: 10px;
            min-width: 120px;
        }
        
        canvas {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            background: #1a1a1a;
        }
        
        .controls {
            margin-top: 20px;
            color: white;
        }
        
        .control-buttons {
            display: grid;
            grid-template-columns: repeat(3, 60px);
            gap: 5px;
            justify-content: center;
            margin-top: 15px;
        }
        
        .control-btn {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            color: white;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .control-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }
        
        .control-btn:active {
            transform: scale(0.95);
        }
        
        .control-btn.up { grid-column: 2; }
        .control-btn.left { grid-column: 1; grid-row: 2; }
        .control-btn.down { grid-column: 2; grid-row: 2; }
        .control-btn.right { grid-column: 3; grid-row: 2; }
        
        .game-over-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .modal-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            color: white;
        }
        
        .modal-content h2 {
            font-size: 2em;
            margin-bottom: 20px;
        }
        
        .restart-btn {
            background: white;
            color: #667eea;
            border: none;
            padding: 15px 30px;
            font-size: 1.2em;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .restart-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
        }
        
        .instructions {
            margin-top: 20px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.9em;
        }
        
        .food-legend {
            margin-top: 15px;
            display: flex;
            justify-content: center;
            gap: 20px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.9em;
        }
        
        .food-type {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .food-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        
        .food-dot.normal {
            background: #FF5722;
        }
        
        .food-dot.special {
            background: #FFD700;
            box-shadow: 0 0 8px #FFD700;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🐍 多食物贪吃蛇</h1>
        
        <div class="game-info">
            <div class="score">得分: <span id="score">0</span></div>
            <div class="food-count">食物: <span id="foodCount">2</span></div>
            <div class="high-score">最高分: <span id="highScore">0</span></div>
        </div>
        
        <canvas id="gameCanvas"></canvas>
        
        <div class="controls">
            <p>使用方向键或下方按钮控制</p>
            <div class="control-buttons">
                <button class="control-btn up" onclick="changeDirection('up')">↑</button>
                <button class="control-btn left" onclick="changeDirection('left')">←</button>
                <button class="control-btn down" onclick="changeDirection('down')">↓</button>
                <button class="control-btn right" onclick="changeDirection('right')">→</button>
            </div>
        </div>
        
        <div class="food-legend">
            <div class="food-type">
                <div class="food-dot normal"></div>
                <span>普通食物 (+10分)</span>
            </div>
            <div class="food-type">
                <div class="food-dot special"></div>
                <span>特殊食物 (+30分)</span>
            </div>
        </div>
        
        <div class="instructions">
            <p>按空格键暂停/继续 | 多个食物同时存在 | 特殊食物分值更高</p>
        </div>
    </div>
    
    <div class="game-over-modal" id="gameOverModal">
        <div class="modal-content">
            <h2>游戏结束！</h2>
            <p>最终得分: <span id="finalScore">0</span></p>
            <p>吃掉食物: <span id="foodsEaten">0</span> 个</p>
            <button class="restart-btn" onclick="restartGame()">重新开始</button>
        </div>
    </div>
    
    <script>
        // 注入游戏数据
        const gameData = {"config": {"gridSize": 20, "cellSize": 20, "initialSpeed": 150, "speedIncrease": 5, "scorePerFood": 10, "maxFoods": 3, "foodSpawnChance": 0.7, "specialFoodChance": 0.1, "colors": {"snake": "#4CAF50", "food": "#FF5722", "specialFood": "#FFD700", "background": "#1a1a1a", "grid": "#333333"}}, "initialState": {"snake": [{"x": 10, "y": 10}, {"x": 9, "y": 10}, {"x": 8, "y": 10}], "foods": [{"x": 15, "y": 10, "type": "normal", "value": 10}, {"x": 5, "y": 8, "type": "normal", "value": 10}], "direction": "right", "nextDirection": "right", "score": 0, "gameOver": false, "isPaused": false, "speed": 150, "foodsEaten": 0}};
        
        // 游戏变量
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const config = gameData.config;
        let gameState = JSON.parse(JSON.stringify(gameData.initialState));
        let highScore = localStorage.getItem('snakeHighScore') || 0;
        let gameLoop = null;
        let animationFrame = 0;
        
        // 设置画布大小
        canvas.width = config.gridSize * config.cellSize;
        canvas.height = config.gridSize * config.cellSize;
        
        // 更新显示
        document.getElementById('highScore').textContent = highScore;
        updateFoodCount();
        
        function updateFoodCount() {
            document.getElementById('foodCount').textContent = gameState.foods.length;
        }
        
        // 游戏函数
        function drawGrid() {
            ctx.strokeStyle = config.colors.grid;
            ctx.lineWidth = 0.5;
            
            for (let i = 0; i <= config.gridSize; i++) {
                ctx.beginPath();
                ctx.moveTo(i * config.cellSize, 0);
                ctx.lineTo(i * config.cellSize, canvas.height);
                ctx.stroke();
                
                ctx.beginPath();
                ctx.moveTo(0, i * config.cellSize);
                ctx.lineTo(canvas.width, i * config.cellSize);
                ctx.stroke();
            }
        }
        
        function drawSnake() {
            gameState.snake.forEach((segment, index) => {
                // 渐变颜色效果
                const opacity = 1 - (index / gameState.snake.length) * 0.3;
                ctx.fillStyle = config.colors.snake + Math.floor(opacity * 255).toString(16).padStart(2, '0');
                
                // 绘制圆角矩形
                const x = segment.x * config.cellSize;
                const y = segment.y * config.cellSize;
                const size = config.cellSize - 2;
                const radius = 4;
                
                ctx.beginPath();
                ctx.moveTo(x + radius, y);
                ctx.lineTo(x + size - radius, y);
                ctx.quadraticCurveTo(x + size, y, x + size, y + radius);
                ctx.lineTo(x + size, y + size - radius);
                ctx.quadraticCurveTo(x + size, y + size, x + size - radius, y + size);
                ctx.lineTo(x + radius, y + size);
                ctx.quadraticCurveTo(x, y + size, x, y + size - radius);
                ctx.lineTo(x, y + radius);
                ctx.quadraticCurveTo(x, y, x + radius, y);
                ctx.closePath();
                ctx.fill();
                
                // 蛇头的眼睛
                if (index === 0) {
                    ctx.fillStyle = 'white';
                    const eyeSize = 3;
                    const eyeOffset = 5;
                    
                    if (gameState.direction === 'right') {
                        ctx.fillRect(x + size - eyeOffset, y + eyeOffset, eyeSize, eyeSize);
                        ctx.fillRect(x + size - eyeOffset, y + size - eyeOffset - eyeSize, eyeSize, eyeSize);
                    } else if (gameState.direction === 'left') {
                        ctx.fillRect(x + eyeOffset - eyeSize, y + eyeOffset, eyeSize, eyeSize);
                        ctx.fillRect(x + eyeOffset - eyeSize, y + size - eyeOffset - eyeSize, eyeSize, eyeSize);
                    } else if (gameState.direction === 'up') {
                        ctx.fillRect(x + eyeOffset, y + eyeOffset - eyeSize, eyeSize, eyeSize);
                        ctx.fillRect(x + size - eyeOffset - eyeSize, y + eyeOffset - eyeSize, eyeSize, eyeSize);
                    } else if (gameState.direction === 'down') {
                        ctx.fillRect(x + eyeOffset, y + size - eyeOffset, eyeSize, eyeSize);
                        ctx.fillRect(x + size - eyeOffset - eyeSize, y + size - eyeOffset, eyeSize, eyeSize);
                    }
                }
            });
        }
        
        function drawFoods() {
            gameState.foods.forEach((food, index) => {
                const x = food.x * config.cellSize + config.cellSize / 2;
                const y = food.y * config.cellSize + config.cellSize / 2;
                
                // 根据食物类型选择颜色
                const foodColor = food.type === 'special' ? config.colors.specialFood : config.colors.food;
                
                // 动画效果
                const pulse = Math.sin(animationFrame * 0.05 + index) * 2;
                const radius = config.cellSize / 2 - 2 + pulse;
                
                // 绘制食物
                ctx.fillStyle = foodColor;
                ctx.beginPath();
                ctx.arc(x, y, radius, 0, Math.PI * 2);
                ctx.fill();
                
                // 特殊食物的光晕效果
                if (food.type === 'special') {
                    ctx.fillStyle = foodColor + '40';
                    ctx.beginPath();
                    ctx.arc(x, y, radius + 4, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // 闪烁效果
                    if (Math.sin(animationFrame * 0.1) > 0) {
                        ctx.fillStyle = foodColor + '60';
                        ctx.beginPath();
                        ctx.arc(x, y, radius + 8, 0, Math.PI * 2);
                        ctx.fill();
                    }
                } else {
                    // 普通食物的微光效果
                    ctx.fillStyle = foodColor + '30';
                    ctx.beginPath();
                    ctx.arc(x, y, radius + 2, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
        }
        
        function generateFood() {
            let newFood;
            let attempts = 0;
            
            do {
                newFood = {
                    x: Math.floor(Math.random() * config.gridSize),
                    y: Math.floor(Math.random() * config.gridSize),
                    type: Math.random() < config.specialFoodChance ? 'special' : 'normal',
                    value: Math.random() < config.specialFoodChance ? 30 : 10
                };
                attempts++;
            } while (
                gameState.snake.some(segment => segment.x === newFood.x && segment.y === newFood.y) ||
                gameState.foods.some(food => food.x === newFood.x && food.y === newFood.y) ||
                attempts > 100
            );
            
            return newFood;
        }
        
        function moveSnake() {
            if (gameState.gameOver || gameState.isPaused) return;
            
            const head = {...gameState.snake[0]};
            
            switch (gameState.direction) {
                case 'up': head.y--; break;
                case 'down': head.y++; break;
                case 'left': head.x--; break;
                case 'right': head.x++; break;
            }
            
            // 检查碰撞
            if (head.x < 0 || head.x >= config.gridSize || 
                head.y < 0 || head.y >= config.gridSize ||
                gameState.snake.some(segment => segment.x === head.x && segment.y === head.y)) {
                gameOver();
                return;
            }
            
            gameState.snake.unshift(head);
            
            // 检查是否吃到食物
            let foodEaten = false;
            gameState.foods = gameState.foods.filter(food => {
                if (head.x === food.x && head.y === food.y) {
                    gameState.score += food.value;
                    gameState.foodsEaten++;
                    document.getElementById('score').textContent = gameState.score;
                    foodEaten = true;
                    return false; // 移除被吃掉的食物
                }
                return true; // 保留其他食物
            });
            
            if (foodEaten) {
                // 生成新食物
                if (gameState.foods.length < config.maxFoods && Math.random() < config.foodSpawnChance) {
                    gameState.foods.push(generateFood());
                }
                
                // 如果食物太少，强制生成一个
                if (gameState.foods.length === 0) {
                    gameState.foods.push(generateFood());
                }
                
                // 增加速度
                if (gameState.speed > 50) {
                    gameState.speed -= config.speedIncrease;
                    clearInterval(gameLoop);
                    gameLoop = setInterval(gameUpdate, gameState.speed);
                }
            } else {
                gameState.snake.pop();
            }
            
            updateFoodCount();
        }
        
        function gameUpdate() {
            moveSnake();
            draw();
            animationFrame++;
        }
        
        function draw() {
            // 清空画布
            ctx.fillStyle = config.colors.background;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            drawGrid();
            drawFoods();
            drawSnake();
        }
        
        function changeDirection(newDirection) {
            if (gameState.gameOver) return;
            
            const opposites = {
                'up': 'down',
                'down': 'up',
                'left': 'right',
                'right': 'left'
            };
            
            if (gameState.direction !== opposites[newDirection]) {
                gameState.nextDirection = newDirection;
            }
        }
        
        function gameOver() {
            gameState.gameOver = true;
            clearInterval(gameLoop);
            
            // 更新最高分
            if (gameState.score > highScore) {
                highScore = gameState.score;
                localStorage.setItem('snakeHighScore', highScore);
                document.getElementById('highScore').textContent = highScore;
            }
            
            // 显示游戏结束模态框
            document.getElementById('finalScore').textContent = gameState.score;
            document.getElementById('foodsEaten').textContent = gameState.foodsEaten;
            document.getElementById('gameOverModal').style.display = 'flex';
        }
        
        function restartGame() {
            gameState = JSON.parse(JSON.stringify(gameData.initialState));
            document.getElementById('score').textContent = 0;
            document.getElementById('gameOverModal').style.display = 'none';
            updateFoodCount();
            animationFrame = 0;
            
            clearInterval(gameLoop);
            gameLoop = setInterval(gameUpdate, gameState.speed);
        }
        
        function togglePause() {
            if (gameState.gameOver) return;
            
            gameState.isPaused = !gameState.isPaused;
        }
        
        // 键盘控制
        document.addEventListener('keydown', (e) => {
            switch(e.key) {
                case 'ArrowUp': 
                    e.preventDefault();
                    changeDirection('up'); 
                    break;
                case 'ArrowDown': 
                    e.preventDefault();
                    changeDirection('down'); 
                    break;
                case 'ArrowLeft': 
                    e.preventDefault();
                    changeDirection('left'); 
                    break;
                case 'ArrowRight': 
                    e.preventDefault();
                    changeDirection('right'); 
                    break;
                case ' ': 
                    e.preventDefault();
                    togglePause(); 
                    break;
            }
        });
        
        // 更新方向
        setInterval(() => {
            if (gameState.direction !== gameState.nextDirection) {
                gameState.direction = gameState.nextDirection;
            }
        }, 50);
        
        // 开始游戏
        draw();
        gameLoop = setInterval(gameUpdate, gameState.speed);
    </script>
</body>
</html>
