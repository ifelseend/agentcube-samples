<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇游戏</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .game-container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        
        h1 {
            color: white;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        #gameCanvas {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }
        
        .score-board {
            color: white;
            font-size: 24px;
            margin: 20px 0;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }
        
        .controls {
            color: white;
            margin-top: 20px;
            font-size: 16px;
            opacity: 0.9;
        }
        
        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            display: none;
            z-index: 1000;
        }
        
        .restart-btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.3s;
        }
        
        .restart-btn:hover {
            background: #45a049;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🐍 贪吃蛇游戏</h1>
        <div class="score-board">
            <span>得分: <span id="score">0</span></span>
            <span style="margin-left: 30px;">最高分: <span id="highScore">0</span></span>
        </div>
        <canvas id="gameCanvas"></canvas>
        <div class="controls">
            使用方向键 ↑ ↓ ← → 控制蛇的移动
        </div>
    </div>
    
    <div class="game-over" id="gameOver">
        <h2>游戏结束！</h2>
        <p>最终得分: <span id="finalScore">0</span></p>
        <button class="restart-btn" onclick="restartGame()">重新开始</button>
    </div>

    <script>
        // 游戏配置数据
        const gameData = {"gridSize": 20, "cellSize": 20, "initialSpeed": 150, "colors": {"snake": "#4CAF50", "food": "#FF5722", "background": "#1a1a1a", "grid": "#333333"}, "initialSnake": [{"x": 10, "y": 10}, {"x": 9, "y": 10}, {"x": 8, "y": 10}], "initialFood": {"x": 15, "y": 15}, "directions": {"UP": {"x": 0, "y": -1}, "DOWN": {"x": 0, "y": 1}, "LEFT": {"x": -1, "y": 0}, "RIGHT": {"x": 1, "y": 0}}};
        
        // 游戏状态
        let canvas, ctx;
        let snake = [];
        let food = {};
        let direction = gameData.directions.RIGHT;
        let nextDirection = gameData.directions.RIGHT;
        let score = 0;
        let highScore = localStorage.getItem('snakeHighScore') || 0;
        let gameRunning = false;
        let gameLoop;
        
        // 初始化游戏
        function init() {
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');
            
            canvas.width = gameData.gridSize * gameData.cellSize;
            canvas.height = gameData.gridSize * gameData.cellSize;
            
            // 初始化蛇
            snake = JSON.parse(JSON.stringify(gameData.initialSnake));
            food = JSON.parse(JSON.stringify(gameData.initialFood));
            direction = gameData.directions.RIGHT;
            nextDirection = gameData.directions.RIGHT;
            score = 0;
            gameRunning = true;
            
            updateScore();
            document.getElementById('highScore').textContent = highScore;
            document.getElementById('gameOver').style.display = 'none';
            
            // 开始游戏循环
            if (gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(update, gameData.initialSpeed);
            
            // 绘制初始画面
            draw();
        }
        
        // 更新游戏状态
        function update() {
            if (!gameRunning) return;
            
            // 更新方向
            direction = nextDirection;
            
            // 计算新的头部位置
            const head = {...snake[0]};
            head.x += direction.x;
            head.y += direction.y;
            
            // 检查碰撞
            if (checkCollision(head)) {
                gameOver();
                return;
            }
            
            // 添加新头部
            snake.unshift(head);
            
            // 检查是否吃到食物
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                updateScore();
                generateFood();
                
                // 加速游戏
                if (score % 50 === 0 && gameData.initialSpeed > 50) {
                    clearInterval(gameLoop);
                    gameData.initialSpeed -= 10;
                    gameLoop = setInterval(update, gameData.initialSpeed);
                }
            } else {
                // 移除尾部
                snake.pop();
            }
            
            draw();
        }
        
        // 检查碰撞
        function checkCollision(head) {
            // 撞墙
            if (head.x < 0 || head.x >= gameData.gridSize || 
                head.y < 0 || head.y >= gameData.gridSize) {
                return true;
            }
            
            // 撞自己
            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    return true;
                }
            }
            
            return false;
        }
        
        // 生成食物
        function generateFood() {
            do {
                food = {
                    x: Math.floor(Math.random() * gameData.gridSize),
                    y: Math.floor(Math.random() * gameData.gridSize)
                };
            } while (snake.some(segment => segment.x === food.x && segment.y === food.y));
        }
        
        // 绘制游戏画面
        function draw() {
            // 清空画布
            ctx.fillStyle = gameData.colors.background;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 绘制网格
            ctx.strokeStyle = gameData.colors.grid;
            ctx.lineWidth = 0.5;
            for (let i = 0; i <= gameData.gridSize; i++) {
                ctx.beginPath();
                ctx.moveTo(i * gameData.cellSize, 0);
                ctx.lineTo(i * gameData.cellSize, canvas.height);
                ctx.stroke();
                
                ctx.beginPath();
                ctx.moveTo(0, i * gameData.cellSize);
                ctx.lineTo(canvas.width, i * gameData.cellSize);
                ctx.stroke();
            }
            
            // 绘制蛇
            snake.forEach((segment, index) => {
                ctx.fillStyle = index === 0 ? '#66BB6A' : gameData.colors.snake;
                ctx.fillRect(
                    segment.x * gameData.cellSize + 2,
                    segment.y * gameData.cellSize + 2,
                    gameData.cellSize - 4,
                    gameData.cellSize - 4
                );
                
                // 蛇头的眼睛
                if (index === 0) {
                    ctx.fillStyle = 'white';
                    const eyeSize = 3;
                    const eyeOffset = 5;
                    
                    if (direction.x === 1) { // 向右
                        ctx.fillRect(segment.x * gameData.cellSize + gameData.cellSize - eyeOffset, segment.y * gameData.cellSize + eyeOffset, eyeSize, eyeSize);
                        ctx.fillRect(segment.x * gameData.cellSize + gameData.cellSize - eyeOffset, segment.y * gameData.cellSize + gameData.cellSize - eyeOffset - eyeSize, eyeSize, eyeSize);
                    } else if (direction.x === -1) { // 向左
                        ctx.fillRect(segment.x * gameData.cellSize + eyeOffset - eyeSize, segment.y * gameData.cellSize + eyeOffset, eyeSize, eyeSize);
                        ctx.fillRect(segment.x * gameData.cellSize + eyeOffset - eyeSize, segment.y * gameData.cellSize + gameData.cellSize - eyeOffset - eyeSize, eyeSize, eyeSize);
                    } else if (direction.y === 1) { // 向下
                        ctx.fillRect(segment.x * gameData.cellSize + eyeOffset, segment.y * gameData.cellSize + gameData.cellSize - eyeOffset, eyeSize, eyeSize);
                        ctx.fillRect(segment.x * gameData.cellSize + gameData.cellSize - eyeOffset - eyeSize, segment.y * gameData.cellSize + gameData.cellSize - eyeOffset, eyeSize, eyeSize);
                    } else { // 向上
                        ctx.fillRect(segment.x * gameData.cellSize + eyeOffset, segment.y * gameData.cellSize + eyeOffset - eyeSize, eyeSize, eyeSize);
                        ctx.fillRect(segment.x * gameData.cellSize + gameData.cellSize - eyeOffset - eyeSize, segment.y * gameData.cellSize + eyeOffset - eyeSize, eyeSize, eyeSize);
                    }
                }
            });
            
            // 绘制食物
            ctx.fillStyle = gameData.colors.food;
            ctx.beginPath();
            ctx.arc(
                food.x * gameData.cellSize + gameData.cellSize / 2,
                food.y * gameData.cellSize + gameData.cellSize / 2,
                gameData.cellSize / 2 - 3,
                0,
                Math.PI * 2
            );
            ctx.fill();
        }
        
        // 更新分数
        function updateScore() {
            document.getElementById('score').textContent = score;
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snakeHighScore', highScore);
                document.getElementById('highScore').textContent = highScore;
            }
        }
        
        // 游戏结束
        function gameOver() {
            gameRunning = false;
            clearInterval(gameLoop);
            document.getElementById('finalScore').textContent = score;
            document.getElementById('gameOver').style.display = 'block';
        }
        
        // 重新开始游戏
        function restartGame() {
            gameData.initialSpeed = 150; // 重置速度
            init();
        }
        
        // 键盘控制
        document.addEventListener('keydown', (e) => {
            if (!gameRunning) return;
            
            switch(e.key) {
                case 'ArrowUp':
                    if (direction.y === 0) {
                        nextDirection = gameData.directions.UP;
                    }
                    e.preventDefault();
                    break;
                case 'ArrowDown':
                    if (direction.y === 0) {
                        nextDirection = gameData.directions.DOWN;
                    }
                    e.preventDefault();
                    break;
                case 'ArrowLeft':
                    if (direction.x === 0) {
                        nextDirection = gameData.directions.LEFT;
                    }
                    e.preventDefault();
                    break;
                case 'ArrowRight':
                    if (direction.x === 0) {
                        nextDirection = gameData.directions.RIGHT;
                    }
                    e.preventDefault();
                    break;
            }
        });
        
        // 启动游戏
        window.onload = init;
    </script>
</body>
</html>
