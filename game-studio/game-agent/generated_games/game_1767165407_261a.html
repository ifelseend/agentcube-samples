<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026元旦烟花庆典</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(to bottom, #0a0e27 0%, #1a1f3a 50%, #2d3561 100%);
            overflow: hidden;
            position: relative;
            height: 100vh;
            cursor: crosshair;
        }
        
        #gameCanvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
        }
        
        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        
        .title {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #FFD700;
            font-size: 2.5em;
            font-weight: bold;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
            animation: glow 2s ease-in-out infinite alternate;
        }
        
        .year-display {
            position: absolute;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            color: #FF69B4;
            font-size: 3em;
            font-weight: bold;
            text-shadow: 0 0 30px rgba(255, 105, 180, 0.8);
            animation: pulse 1.5s ease-in-out infinite;
        }
        
        .score {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #FFFFFF;
            font-size: 1.2em;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            border-radius: 10px;
            border: 2px solid #FFD700;
        }
        
        .blessing {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            color: #FFFFFF;
            font-size: 1.5em;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            opacity: 0;
            animation: fadeInOut 3s ease-in-out;
            pointer-events: none;
        }
        
        .instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #FFFFFF;
            font-size: 1em;
            opacity: 0.8;
            text-align: center;
        }
        
        @keyframes glow {
            from { text-shadow: 0 0 20px rgba(255, 215, 0, 0.8); }
            to { text-shadow: 0 0 30px rgba(255, 215, 0, 1), 0 0 40px rgba(255, 215, 0, 0.8); }
        }
        
        @keyframes pulse {
            0%, 100% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.1); }
        }
        
        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateX(-50%) translateY(20px); }
            50% { opacity: 1; transform: translateX(-50%) translateY(0); }
            100% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
        }
        
        .countdown {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 8em;
            color: #FFD700;
            font-weight: bold;
            text-shadow: 0 0 50px rgba(255, 215, 0, 0.8);
            display: none;
            animation: countdownPulse 1s ease-in-out;
        }
        
        @keyframes countdownPulse {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
        }
    </style>
</head>

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = gameData.game_settings.canvas_width;
        canvas.height = gameData.game_settings.canvas_height;

        // 烟花类
        class Firework {
            constructor(x, y, targetX, targetY, color) {
                this.x = x;
                this.y = y;
                this.startX = x;
                this.startY = y;
                this.targetX = targetX;
                this.targetY = targetY;
                this.distanceToTarget = Math.sqrt(Math.pow(targetX - x, 2) + Math.pow(targetY - y, 2));
                this.distanceTraveled = 0;
                this.trail = [];
                this.trailLength = 10;
                this.angle = Math.atan2(targetY - y, targetX - x);
                this.speed = gameData.game_settings.launch_speed;
                this.acceleration = 1.05;
                this.brightness = random(50, 70);
                this.targetRadius = 1;
                this.color = color;
            }
            
            update() {
                this.trail.push({x: this.x, y: this.y});
                if (this.trail.length > this.trailLength) {
                    this.trail.shift();
                }
                
                this.speed *= this.acceleration;
                const vx = Math.cos(this.angle) * this.speed;
                const vy = Math.sin(this.angle) * this.speed;
                
                this.distanceTraveled = Math.sqrt(Math.pow(this.x - this.startX, 2) + Math.pow(this.y - this.startY, 2));
                
                if (this.distanceTraveled >= this.distanceToTarget) {
                    createParticles(this.targetX, this.targetY, this.color);
                    fireworks.splice(fireworks.indexOf(this), 1);
                } else {
                    this.x += vx;
                    this.y += vy;
                }
            }
            
            draw() {
                ctx.beginPath();
                ctx.moveTo(this.trail[0]?.x || this.x, this.trail[0]?.y || this.y);
                
                for (let i = 0; i < this.trail.length; i++) {
                    ctx.lineTo(this.trail[i].x, this.trail[i].y);
                }
                
                ctx.lineTo(this.x, this.y);
                ctx.strokeStyle = `hsl(${this.color}, 100%, ${this.brightness}%)`;
                ctx.stroke();
                
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.targetRadius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
            }
        }
        
        // 粒子类
        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                const template = gameData.fireworks[Math.floor(Math.random() * gameData.fireworks.length)];
                this.color = template.color;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * template.explosion_radius / 20;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.gravity = gameData.game_settings.gravity;
                this.friction = gameData.game_settings.friction;
                this.alpha = 1;
                this.decay = Math.random() * 0.02 + 0.01;
                this.trail = [];
                this.trailLength = template.trail_length;
            }
            
            update() {
                this.trail.push({x: this.x, y: this.y, alpha: this.alpha});
                if (this.trail.length > this.trailLength) {
                    this.trail.shift();
                }
                
                this.vx *= this.friction;
                this.vy *= this.friction;
                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.decay;
                
                if (this.alpha <= 0) {
                    particles.splice(particles.indexOf(this), 1);
                }
            }
            
            draw() {
                ctx.save();
                
                // 绘制轨迹
                for (let i = 0; i < this.trail.length; i++) {
                    const trail = this.trail[i];
                    ctx.globalAlpha = trail.alpha * (i / this.trail.length) * 0.5;
                    ctx.beginPath();
                    ctx.arc(trail.x, trail.y, 2, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.fill();
                }
                
                // 绘制粒子
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                
                ctx.restore();
            }
        }
        
        // 创建粒子爆炸
        function createParticles(x, y, color) {
            const template = gameData.fireworks[Math.floor(Math.random() * gameData.fireworks.length)];
            for (let i = 0; i < template.particle_count; i++) {
                particles.push(new Particle(x, y, color));
            }
        }
        
        // 绘制星星背景
        function drawStars() {
            stars.forEach(star => {
                star.twinkle = Math.sin(Date.now() * star.twinkle_speed) * 0.5 + 0.5;
                ctx.globalAlpha = star.twinkle;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fillStyle = '#FFFFFF';
                ctx.fill();
            });
            ctx.globalAlpha = 1;
        }
        
        // 显示祝福语
        function showBlessing() {
            const blessing = gameData.blessings[Math.floor(Math.random() * gameData.blessings.length)];
            const display = document.getElementById('blessingDisplay');
            display.textContent = blessing;
            display.style.animation = 'none';
            setTimeout(() => {
                display.style.animation = 'fadeInOut 3s ease-in-out';
            }, 10);
        }
        
        // 更新UI
        function updateUI() {
            document.getElementById('fireworkCount').textContent = fireworkCount;
            document.getElementById('comboCount').textContent = comboCount;
        }
        
        // 超级烟花秀
        function superFireworkShow() {
            for (let i = 0; i < 10; i++) {
                setTimeout(() => {
                    const x = Math.random() * canvas.width;
                    const y = Math.random() * canvas.height * 0.5;
                    const targetX = Math.random() * canvas.width;
                    const targetY = Math.random() * canvas.height * 0.5;
                    const color = Math.random() * 360;
                    fireworks.push(new Firework(x, y, targetX, targetY, color));
                }, i * 100);
            }
            showBlessing();
        }
        
        // 动画循环
        function animate() {
            ctx.fillStyle = 'rgba(10, 14, 39, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            drawStars();
            
            fireworks.forEach(firework => {
                firework.update();
                firework.draw();
            });
            
            particles.forEach(particle => {
                particle.update();
                particle.draw();
            });
            
            animationId = requestAnimationFrame(animate);
        }
        
        // 工具函数
        function random(min, max) {
            return Math.random() * (max - min) + min;
        }
        
        // 事件监听
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            const startX = Math.random() * canvas.width;
            const startY = canvas.height;
            const color = Math.random() * 360;
            
            fireworks.push(new Firework(startX, startY, x, y, color));
            
            fireworkCount++;
            
            // 连击系统
            const currentTime = Date.now();
            if (currentTime - lastClickTime < 1000) {
                comboCount++;
                if (comboCount % 5 === 0) {
                    showBlessing();
                }
            } else {
                comboCount = 1;
            }
            lastClickTime = currentTime;
            
            updateUI();
        });
        
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                superFireworkShow();
            }
        });
        
        // 初始化
        function init() {
            // 显示年份
            document.getElementById('yearDisplay').textContent = gameData.year;
            
            // 倒计时效果
            const countdown = document.getElementById('countdown');
            let count = 3;
            countdown.style.display = 'block';
            countdown.textContent = count;
            
            const countInterval = setInterval(() => {
                count--;
                if (count > 0) {
                    countdown.textContent = count;
                    countdown.style.animation = 'none';
                    setTimeout(() => {
                        countdown.style.animation = 'countdownPulse 1s ease-in-out';
                    }, 10);
                } else {
                    countdown.textContent = '🎊';
                    countdown.style.animation = 'none';
                    setTimeout(() => {
                        countdown.style.animation = 'countdownPulse 1s ease-in-out';
                    }, 10);
                    setTimeout(() => {
                        countdown.style.display = 'none';
                        superFireworkShow();
                    }, 1000);
                    clearInterval(countInterval);
                }
            }, 1000);
            
            animate();
        }
        
        init();
    </script>
</body>
</html>
