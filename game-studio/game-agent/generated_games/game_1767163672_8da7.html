<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数独游戏</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .game-container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        
        .sudoku-board {
            display: grid;
            grid-template-columns: repeat(9, 50px);
            grid-template-rows: repeat(9, 50px);
            gap: 1px;
            background: #333;
            border: 3px solid #333;
            margin: 0 auto;
        }
        
        .cell {
            background: white;
            border: 1px solid #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .cell:hover {
            background: #f0f0f0;
        }
        
        .cell.selected {
            background: #e3f2fd;
        }
        
        .cell.fixed {
            background: #f5f5f5;
            color: #333;
            cursor: default;
        }
        
        .cell.error {
            background: #ffebee;
            color: #c62828;
        }
        
        .cell.correct {
            background: #e8f5e8;
            color: #2e7d32;
        }
        
        /* 3x3方格边框 */
        .cell:nth-child(3n) {
            border-right: 2px solid #333;
        }
        
        .cell:nth-child(n+19):nth-child(-n+27),
        .cell:nth-child(n+46):nth-child(-n+54) {
            border-bottom: 2px solid #333;
        }
        
        .controls {
            margin-top: 20px;
            text-align: center;
        }
        
        .number-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .num-btn {
            width: 40px;
            height: 40px;
            font-size: 18px;
            font-weight: bold;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .num-btn:hover {
            background: #667eea;
            color: white;
        }
        
        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        
        .btn {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-clear {
            background: #ff6b6b;
            color: white;
        }
        
        .btn-clear:hover {
            background: #ff5252;
        }
        
        .btn-check {
            background: #4ecdc4;
            color: white;
        }
        
        .btn-check:hover {
            background: #45b7aa;
        }
        
        .btn-solve {
            background: #95e77e;
            color: #333;
        }
        
        .btn-solve:hover {
            background: #7dd667;
        }
        
        .message {
            text-align: center;
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
            min-height: 25px;
        }
        
        .success {
            color: #4caf50;
        }
        
        .error {
            color: #f44336;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>数独游戏</h1>
        <div class="sudoku-board" id="board"></div>
        
        <div class="controls">
            <div class="number-buttons">
                <button class="num-btn" data-num="1">1</button>
                <button class="num-btn" data-num="2">2</button>
                <button class="num-btn" data-num="3">3</button>
                <button class="num-btn" data-num="4">4</button>
                <button class="num-btn" data-num="5">5</button>
                <button class="num-btn" data-num="6">6</button>
                <button class="num-btn" data-num="7">7</button>
                <button class="num-btn" data-num="8">8</button>
                <button class="num-btn" data-num="9">9</button>
            </div>
            
            <div class="action-buttons">
                <button class="btn btn-clear" id="clearBtn">清除</button>
                <button class="btn btn-check" id="checkBtn">检查</button>
                <button class="btn btn-solve" id="solveBtn">显示答案</button>
            </div>
            
            <div class="message" id="message"></div>
        </div>
    </div>

    <script>
        // 注入游戏数据
        const gameData = {"puzzle": [[3, 7, 5, 0, 0, 4, 0, 0, 0], [1, 0, 0, 0, 0, 9, 4, 0, 0], [0, 9, 2, 0, 8, 0, 0, 0, 0], [0, 1, 7, 0, 6, 0, 3, 0, 4], [2, 0, 9, 0, 0, 3, 0, 6, 0], [0, 0, 4, 0, 9, 1, 0, 7, 0], [0, 0, 0, 7, 3, 8, 2, 5, 6], [8, 2, 6, 0, 0, 0, 0, 0, 3], [0, 5, 0, 0, 1, 0, 9, 0, 0]], "solution": [[3, 7, 5, 1, 2, 4, 6, 8, 9], [1, 6, 8, 3, 5, 9, 4, 2, 7], [4, 9, 2, 6, 8, 7, 1, 3, 5], [5, 1, 7, 8, 6, 2, 3, 9, 4], [2, 8, 9, 4, 7, 3, 5, 6, 1], [6, 3, 4, 5, 9, 1, 8, 7, 2], [9, 4, 1, 7, 3, 8, 2, 5, 6], [8, 2, 6, 9, 4, 5, 7, 1, 3], [7, 5, 3, 2, 1, 6, 9, 4, 8]], "difficulty": "medium"};
        
        class SudokuGame {
            constructor() {
                this.board = document.getElementById('board');
                this.message = document.getElementById('message');
                this.selectedCell = null;
                this.currentBoard = [];
                this.solution = gameData.solution;
                
                this.init();
            }
            
            init() {
                this.createBoard();
                this.attachEventListeners();
            }
            
            createBoard() {
                this.board.innerHTML = '';
                this.currentBoard = [];
                
                for (let i = 0; i < 9; i++) {
                    this.currentBoard[i] = [];
                    for (let j = 0; j < 9; j++) {
                        const cell = document.createElement('div');
                        cell.className = 'cell';
                        cell.dataset.row = i;
                        cell.dataset.col = j;
                        
                        const value = gameData.puzzle[i][j];
                        if (value !== 0) {
                            cell.textContent = value;
                            cell.classList.add('fixed');
                            this.currentBoard[i][j] = value;
                        } else {
                            this.currentBoard[i][j] = 0;
                        }
                        
                        this.board.appendChild(cell);
                    }
                }
            }
            
            attachEventListeners() {
                // 单元格点击事件
                this.board.addEventListener('click', (e) => {
                    if (e.target.classList.contains('cell') && !e.target.classList.contains('fixed')) {
                        this.selectCell(e.target);
                    }
                });
                
                // 数字按钮点击事件
                document.querySelectorAll('.num-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const num = parseInt(btn.dataset.num);
                        this.setNumber(num);
                    });
                });
                
                // 键盘事件
                document.addEventListener('keydown', (e) => {
                    if (e.key >= '1' && e.key <= '9') {
                        this.setNumber(parseInt(e.key));
                    } else if (e.key === 'Delete' || e.key === 'Backspace') {
                        this.clearCell();
                    }
                });
                
                // 清除按钮
                document.getElementById('clearBtn').addEventListener('click', () => {
                    this.clearCell();
                });
                
                // 检查按钮
                document.getElementById('checkBtn').addEventListener('click', () => {
                    this.checkSolution();
                });
                
                // 显示答案按钮
                document.getElementById('solveBtn').addEventListener('click', () => {
                    this.showSolution();
                });
            }
            
            selectCell(cell) {
                // 移除之前的选中状态
                if (this.selectedCell) {
                    this.selectedCell.classList.remove('selected');
                }
                
                // 选中新单元格
                this.selectedCell = cell;
                cell.classList.add('selected');
            }
            
            setNumber(num) {
                if (!this.selectedCell) return;
                
                const row = parseInt(this.selectedCell.dataset.row);
                const col = parseInt(this.selectedCell.dataset.col);
                
                this.selectedCell.textContent = num;
                this.currentBoard[row][col] = num;
                
                // 检查是否正确
                if (num === this.solution[row][col]) {
                    this.selectedCell.classList.remove('error');
                    this.selectedCell.classList.add('correct');
                } else {
                    this.selectedCell.classList.remove('correct');
                    this.selectedCell.classList.add('error');
                }
                
                // 检查是否完成
                if (this.isComplete()) {
                    this.showMessage('恭喜！你完成了数独！', 'success');
                }
            }
            
            clearCell() {
                if (!this.selectedCell) return;
                
                const row = parseInt(this.selectedCell.dataset.row);
                const col = parseInt(this.selectedCell.dataset.col);
                
                this.selectedCell.textContent = '';
                this.currentBoard[row][col] = 0;
                this.selectedCell.classList.remove('error', 'correct');
            }
            
            checkSolution() {
                let hasErrors = false;
                const cells = this.board.querySelectorAll('.cell');
                
                cells.forEach(cell => {
                    const row = parseInt(cell.dataset.row);
                    const col = parseInt(cell.dataset.col);
                    
                    if (this.currentBoard[row][col] !== 0) {
                        if (this.currentBoard[row][col] === this.solution[row][col]) {
                            cell.classList.remove('error');
                            cell.classList.add('correct');
                        } else {
                            cell.classList.remove('correct');
                            cell.classList.add('error');
                            hasErrors = true;
                        }
                    }
                });
                
                if (hasErrors) {
                    this.showMessage('有一些错误，请检查红色标记的格子', 'error');
                } else if (this.isComplete()) {
                    this.showMessage('完美！所有答案都正确！', 'success');
                } else {
                    this.showMessage('目前没有错误，继续加油！', 'success');
                }
            }
            
            showSolution() {
                const cells = this.board.querySelectorAll('.cell');
                
                cells.forEach(cell => {
                    const row = parseInt(cell.dataset.row);
                    const col = parseInt(cell.dataset.col);
                    
                    cell.textContent = this.solution[row][col];
                    this.currentBoard[row][col] = this.solution[row][col];
                    
                    if (!cell.classList.contains('fixed')) {
                        cell.classList.add('correct');
                    }
                });
                
                this.showMessage('已显示完整答案', 'success');
            }
            
            isComplete() {
                for (let i = 0; i < 9; i++) {
                    for (let j = 0; j < 9; j++) {
                        if (this.currentBoard[i][j] !== this.solution[i][j]) {
                            return false;
                        }
                    }
                }
                return true;
            }
            
            showMessage(text, type) {
                this.message.textContent = text;
                this.message.className = `message ${type}`;
                
                setTimeout(() => {
                    this.message.textContent = '';
                    this.message.className = 'message';
                }, 3000);
            }
        }
        
        // 启动游戏
        const game = new SudokuGame();
    </script>
</body>
</html>
